
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="John Michael P - Full Stack Developer creating modern websites, business solutions and AI-powered applications.">
    <meta name="author" content="John Michael P">

    <title>John Michael P | Full Stack Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        :root {
            --bg: #050810;
            --card: #101725;
            --cyan: #00f7ff;
            --purple: #7000ff;
            --white: #ffffff;
            --muted: #b5bdca;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--white);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        section {
            padding: 110px 10%;
            scroll-margin-top: 75px;
        }

        /* NAVBAR */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 8, 16, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            color: var(--cyan);
            font-size: 1.4rem;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--cyan);
        }

        .menu-btn {
            display: none;
            color: var(--cyan);
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(
                circle at center,
                rgba(0,247,255,0.12),
                transparent 65%
            );
        }

        .profile-img-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--cyan);
            box-shadow: 0 0 30px rgba(0,247,255,0.4);
            margin-bottom: 30px;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            margin-bottom: 15px;
        }

        .hero h1 span,
        .section-title span {
            color: var(--cyan);
        }

        .hero p {
            max-width: 750px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.8;
        }

        .tagline {
            color: var(--cyan);
            margin-bottom: 15px;
        }

        /* BUTTON */

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 13px 32px;
            background: linear-gradient(45deg, var(--cyan), var(--purple));
            color: white;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,247,255,0.3);
        }

        /* SECTION TITLE */

        .section-title {
            font-size: clamp(2rem, 5vw, 2.7rem);
            text-align: center;
            margin-bottom: 55px;
        }

        /* GRID */

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--cyan);
            box-shadow: 0 10px 30px rgba(0,247,255,0.12);
        }

        .card i {
            font-size: 2.7rem;
            color: var(--cyan);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-bottom: 12px;
            font-size: 1.3rem;
        }

        .card p {
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.7;
        }

        /* ABOUT */

        .about-content {
            max-width: 850px;
            margin: auto;
            text-align: center;
        }

        .about-content p {
            color: var(--muted);
            line-height: 1.9;
        }

        /* SKILLS */

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .skill {
            padding: 12px 25px;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            border-radius: 30px;
            transition: 0.3s;
        }

        .skill:hover {
            background: var(--cyan);
            color: var(--bg);
        }

        /* PROJECTS */

        .img-box {
            width: 100%;
            height: 190px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #080d17;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-btn {
            display: inline-block;
            margin: 15px 0 20px;
            padding: 9px 20px;
            background: linear-gradient(45deg, var(--cyan), var(--purple));
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* CONTACT */

        .contact-content {
            text-align: center;
        }

        .contact-content p {
            color: var(--muted);
        }

        .social-icons {
            margin-top: 40px;
        }

        .social-icons a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            margin: 0 8px;
            font-size: 1.3rem;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: var(--cyan);
            border-color: var(--cyan);
            transform: translateY(-5px);
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 30px 10%;
            background: #020408;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* ANIMATION */

        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition: opacity 0.7s ease, transform 0.7s ease
        }
